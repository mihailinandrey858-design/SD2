# Nginx-прокси для SDonate на VPS.
# Установка на сервере:
#   cp /opt/sdonate/deploy/nginx-sdonate.conf /etc/nginx/sites-available/sdonate
#   ln -sf /etc/nginx/sites-available/sdonate /etc/nginx/sites-enabled/sdonate
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# После этого HTTPS:  certbot --nginx -d sdonate.duckdns.org

server {
    listen 80;
    server_name sdonate.duckdns.org sdonate.soligrief.pw 109.238.93.205;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
