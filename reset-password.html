<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090a13">
    <title>Сброс пароля — SDonate</title>
    <link rel="icon" type="image/png" href="./img/Серебристый куб с эмблемой SD.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/reset-password.css">
</head>
<body>
    <a class="back-link" href="./reg.html?mode=login"><span aria-hidden="true">←</span> Назад</a>
    <main class="auth-layout">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>

        <section class="auth-card" aria-labelledby="auth-title">
            <a href="./index.html" class="brand" aria-label="SDonate — на главную">
                <img src="./img/Серебристый куб с эмблемой SD.png" alt="">
                <span>SDonate</span>
            </a>

            <div class="auth-heading">
                <span class="auth-kicker">АККАУНТ SDonate</span>
                <h1 id="auth-title">Восстановление</h1>
                <p id="auth-subtitle">пароля</p>
            </div>

            <form id="reset-request-form" class="auth-form" novalidate>
                <label class="field-label" for="reset-email">Email</label>
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">@</span>
                    <input id="reset-email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <button class="submit-button" id="request-submit" type="submit">
                    <span>Отправить ссылку</span>
                    <span aria-hidden="true">↗</span>
                </button>
            </form>

            <form id="reset-confirm-form" class="auth-form" hidden novalidate>
                <div class="password-label-row">
                    <label class="field-label" for="new-password">Новый пароль</label>
                </div>
                <div class="input-wrap">
                    <span class="input-icon lock-icon" aria-hidden="true">◆</span>
                    <input id="new-password" name="newPassword" type="password" placeholder="Введите новый пароль" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="confirm-field">
                    <label class="field-label" for="new-password-confirm">Повторите пароль</label>
                    <div class="input-wrap">
                        <span class="input-icon lock-icon" aria-hidden="true">◆</span>
                        <input id="new-password-confirm" name="confirmPassword" type="password" placeholder="Повторите пароль" autocomplete="new-password" required>
                    </div>
                </div>

                <button class="submit-button" id="confirm-submit" type="submit">
                    <span>Сохранить пароль</span>
                    <span aria-hidden="true">↗</span>
                </button>
            </form>

            <p class="form-message" id="form-message" role="status" aria-live="polite" hidden></p>

            <div class="auth-switch">
                <span>Уже вспомнили пароль?</span>
                <a href="./reg.html?mode=login">Войти</a>
            </div>
        </section>
    </main>

    <script src="./js/reset-password.js"></script>
</body>
</html>
